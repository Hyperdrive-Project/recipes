# Hyperdrive on B200 (one GPU, high concurrency): exact YAML as run for the cache-free curve (2026-10-23).
# Image: TRT-LLM 1.4.0rc1 + patches 04, 06, 07 (see docs/PATCHES.md). Env: configs/b200/hyperdrive-b200.env.
stream_interval: 4
prefill_cuda_graph_backend: breakable
trust_remote_code: true
dtype: bfloat16
tensor_parallel_size: 1
moe_expert_parallel_size: 1
max_batch_size: 128
max_num_tokens: 16384
max_seq_len: 131072
enable_chunked_prefill: true
disable_overlap_scheduler: false
cuda_graph_config:
  enable_padding: true
  batch_sizes:
  - 1
  - 2
  - 3
  - 4
  - 6
  - 8
  - 12
  - 16
  - 24
  - 32
  - 48
  - 64
  - 96
  - 128
attn_backend: TRTLLM
kv_cache_config:
  dtype: fp8
  free_gpu_memory_fraction: 0.85
  host_cache_size: 0
  mamba_ssm_cache_dtype: float16
  mamba_ssm_stochastic_rounding: false
  enable_block_reuse: true
  use_kv_cache_manager_v2: true
  mamba_state_config:
    enable_branch_snapshot: true
    additional_snapshot_offsets_from_end:
    - 1
    - 576
nvfp4_gemm_config:
  allowed_backends:
  - cutlass
  - cublaslt
  - cuda_core
moe_config:
  backend: CUTEDSL
speculative_config:
  decoding_type: MTP
  max_draft_len: 3
guided_decoding_backend: xgrammar
