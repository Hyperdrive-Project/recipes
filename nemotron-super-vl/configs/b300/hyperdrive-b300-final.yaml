# Apache-2.0. If this helps you, a credit to Hyperdrive recipes is appreciated.
# Hyperdrive on B300, FINAL (Config F, 2026-10-23): batch 160, 32K prefill chunks, F5. 7,851 output tok/s at 160 users, 75 per user,
# with ~50% prefix-cache hits from AIPerf warm-up replay; with unique prompts 5,658 burst / 5,500 sustained. Newer: hyperdrive-b300-v2.yaml (PR #10).
# Env: configs/b300/hyperdrive-b300.env (NHD_F5=1 needs patch 03 + nhd_mk). Exact file as run.
stream_interval: 4
prefill_cuda_graph_backend: breakable
trust_remote_code: true
dtype: bfloat16
tensor_parallel_size: 1
moe_expert_parallel_size: 1
max_batch_size: 160
max_num_tokens: 32768
max_seq_len: 131072
enable_chunked_prefill: true
disable_overlap_scheduler: false
cuda_graph_config:
  enable_padding: true
  batch_sizes:
  - 1
  - 2
  - 3
  - 4
  - 6
  - 8
  - 12
  - 16
  - 24
  - 32
  - 48
  - 64
  - 96
  - 128
  - 160
attn_backend: TRTLLM
kv_cache_config:
  dtype: fp8
  free_gpu_memory_fraction: 0.85
  host_cache_size: 0
  mamba_ssm_cache_dtype: float16
  mamba_ssm_stochastic_rounding: false
  enable_block_reuse: true
  use_kv_cache_manager_v2: true
  mamba_state_config:
    enable_branch_snapshot: true
    additional_snapshot_offsets_from_end:
    - 1
    - 576
nvfp4_gemm_config:
  allowed_backends:
  - cutlass
  - cublaslt
  - cuda_core
moe_config:
  backend: CUTEDSL
speculative_config:
  decoding_type: MTP
  max_draft_len: 3
guided_decoding_backend: xgrammar
