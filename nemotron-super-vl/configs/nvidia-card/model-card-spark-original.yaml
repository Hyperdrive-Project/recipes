# Verbatim from the model card "1x DGX Spark" TRT-LLM recipe (rev 59b87216), only speculative_model path adapted.
trust_remote_code: true
dtype: bfloat16
tensor_parallel_size: 1
moe_expert_parallel_size: 1
max_batch_size: 2
max_num_tokens: 4096
max_seq_len: 131072

enable_chunked_prefill: true
disable_overlap_scheduler: false
cuda_graph_config: null
attn_backend: TRTLLM

kv_cache_config:
  dtype: fp8
  free_gpu_memory_fraction: 0.9
  max_gpu_total_bytes: 5368709120
  host_cache_size: 0
  mamba_ssm_cache_dtype: float16
  mamba_ssm_stochastic_rounding: false
  enable_block_reuse: true
  use_kv_cache_manager_v2: true
  mamba_state_config:
    enable_branch_snapshot: true

nvfp4_gemm_config:
  allowed_backends: [cutlass, cublaslt, cuda_core]

moe_config:
  backend: CUTEDSL

speculative_config:
  decoding_type: DFlash
  speculative_model: /models/super-vl-lilicorr
  max_draft_len: 7
  attention_backend: VANILLA  # card says TRTLLM; image ace058d1 raises "requires SM100 or SM103, got SM121" (modeling_dflash.py:467)
  # context_recompute_tail: 0  -- removed: option added by TRT-LLM PR 19745 (merged 2026-10-09), absent in image commit ace058d1; 0 == feature off, same as absence

guided_decoding_backend: xgrammar
